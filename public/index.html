<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Message Sender</title>
  <link rel="icon" href="wa.png" type="image/png">

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div x-data="dashboard()" class="w-full max-w-2xl bg-white shadow-xl rounded-lg p-8">

  <h2 class="text-3xl font-bold text-gray-800 mb-6">WhatsApp Sender</h2>

  <!-- Recipient Input -->
  <div class="mb-6">
    <label class="block text-gray-700 font-semibold mb-2">Recipients (comma separated)</label>
    <textarea
      x-model="recipients"
      placeholder="919876543210, 918888888888"
      class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
    ></textarea>
  </div>

  <!-- Message Type Switch -->
  <div class="flex gap-4 mb-6">
    <button
      @click="type='text'"
      :class="type==='text' ? 'bg-green-500 text-white' : 'bg-gray-200'"
      class="px-4 py-2 rounded-lg font-semibold transition"
    >Text Message</button>

    <button
      @click="type='media'"
      :class="type==='media' ? 'bg-green-500 text-white' : 'bg-gray-200'"
      class="px-4 py-2 rounded-lg font-semibold transition"
    >Media Message</button>
  </div>

  <!-- TEXT MESSAGE -->
  <div x-show="type==='text'" class="mb-6">
    <label class="block text-gray-700 font-semibold mb-2">Message</label>
    <textarea
      x-model="message"
      placeholder="Type your message…"
      class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
    ></textarea>
  </div>

  <!-- MEDIA MESSAGE -->
  <div x-show="type==='media'" class="mb-6">
    <label class="block text-gray-700 font-semibold mb-2">Upload Media</label>
    <input type="file" @change="handleFile($event)" class="w-full p-3 border rounded-lg bg-gray-50" />

    <label class="block text-gray-700 font-semibold mt-4 mb-2">Caption (optional)</label>
    <textarea
      x-model="caption"
      class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
      placeholder="Caption for media…"
    ></textarea>

    <!-- File Preview -->
    <template x-if="preview">
      <div class="mt-4">
        <p class="font-semibold mb-1">Preview:</p>
        <img x-show="isImage" :src="preview" class="w-40 rounded-lg shadow" />
        <p x-show="!isImage" class="text-gray-600">{{ filename }}</p>
      </div>
    </template>
  </div>

  <!-- STATUS -->
  <div
    x-show="status"
    x-text="status"
    class="p-4 rounded-lg font-semibold mt-4"
    :class="statusType==='success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
  ></div>

  <!-- Send Button -->
  <button
    @click="send()"
    :disabled="loading"
    class="w-full mt-6 bg-green-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-green-700 disabled:bg-gray-400"
  >
    <span x-show="!loading">Send Message</span>
    <span x-show="loading" class="flex items-center justify-center">
      <svg class="animate-spin h-5 w-5 mr-2" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="white" stroke-width="4"></circle>
        <path class="opacity-75" fill="white" d="M4 12a8 8 0 018-8V0"></path>
      </svg>
      Sending…
    </span>
  </button>

</div>

<script>
function dashboard() {
  return {
    recipients: "",
    message: "",
    caption: "",
    type: "text",
    loading: false,

    // media
    file: null,
    preview: null,
    filename: "",
    isImage: false,

    status: "",
    statusType: "success",

    async handleFile(event) {
      const f = event.target.files[0];
      if (!f) return;

      this.file = f;
      this.filename = f.name;

      // Preview
      if (f.type.startsWith("image/")) {
        this.preview = URL.createObjectURL(f);
        this.isImage = true;
      } else {
        this.preview = null;
        this.isImage = false;
      }
    },

    async fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    },

    async send() {
      this.loading = true;
      this.status = "";

      const nums = this.recipients
        .split(",")
        .map(n => n.trim())
        .filter(n => n.length > 0);

      if (nums.length === 0) {
        this.status = "Please enter at least 1 phone number.";
        this.statusType = "error";
        this.loading = false;
        return;
      }

      let payload = { recipients: nums };

      // TEXT
      if (this.type === "text") {
        payload.message = this.message.trim();
      }

      // MEDIA
      if (this.type === "media" && this.file) {
        const base64 = await this.fileToBase64(this.file);

        payload.media = {
          filename: this.file.name,
          mimetype: this.file.type,
          data: base64,
          caption: this.caption || ""
        };
      }

      try {
        const res = await fetch("http://localhost:3000/send-message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await res.json();

        if (data.success) {
          this.status = data.message;
          this.statusType = "success";
        } else {
          this.status = data.error;
          this.statusType = "error";
        }

      } catch (e) {
        this.status = "Server Error: " + e.message;
        this.statusType = "error";
      }

      this.loading = false;
    }
  }
}
</script>

</body>
</html>
